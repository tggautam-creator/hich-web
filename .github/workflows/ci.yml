name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 2026-06-05 — bumped actions/checkout + actions/setup-node
          # 4 → 5 so the runners use Node 24 instead of the deprecated
          # Node 20 (forced default 2026-06-16). Node version installed
          # for the build itself stays on LTS 22.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --run

      # 2026-05-20 — `build:ci` runs `vite build --mode dev` so the
      # `assertProdEnv()` guard in vite.config.ts doesn't trip on CI's
      # placeholder env values. Production builds (Vercel) still use
      # `npm run build` which enforces real prod Supabase/Firebase IDs.
      - run: npm run build:ci
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key
          VITE_GOOGLE_PLACES_KEY: placeholder-key
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
