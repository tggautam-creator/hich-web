name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 2026-05-20 — bumped 20 → 22 (LTS). Node 20 will be removed
          # from GitHub Actions runners on 2026-09-16; Node 24 becomes
          # the default 2026-06-02. Staying on LTS 22 keeps CI stable
          # until we hit a forcing function to move to 24.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --run

      # 2026-05-20 — `build:ci` runs `vite build --mode dev` so the
      # `assertProdEnv()` guard in vite.config.ts doesn't trip on CI's
      # placeholder env values. Production builds (Vercel) still use
      # `npm run build` which enforces real prod Supabase/Firebase IDs.
      - run: npm run build:ci
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key
          VITE_GOOGLE_PLACES_KEY: placeholder-key
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
